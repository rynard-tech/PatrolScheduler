[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patrol-scheduler"
version = "0.1.0"
description = "Explainable constraint-based ski patrol schedule generator"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
patrol-scheduler = "patrol_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
